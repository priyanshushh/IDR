# Alembic configuration for the TENANT migration chain.
#
# This is a second, independent Alembic environment alongside the main
# alembic.ini. It owns only the four tenant-scoped tables (documents,
# document_permissions, groups, group_members) — everything else (company,
# users, company_members, refresh_tokens) is still migrated through the main
# `alembic/` chain via `alembic.ini`.
#
# Unlike the main chain, "upgrade head" here does not apply to one schema —
# alembic_tenant/env.py loops over every company.schema_name in the database
# and re-applies pending revisions to each one. See
# build_docs/06-schema-per-tenant-migration.md for the full design writeup.
#
# Usage:
#   alembic -c alembic_tenant.ini revision -m "..."      # write a new tenant migration
#   alembic -c alembic_tenant.ini upgrade head            # apply it to every tenant schema
#   alembic -c alembic_tenant.ini current                 # (only meaningful with -x schema=<name>)

[alembic]
script_location = %(here)s/alembic_tenant
prepend_sys_path = .
path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
